<div class="container">
  <div>
    <span class="__field-label" [textContent]="label()"></span>
    @if (isAstriskVisible) {
      <span [class.astrisk]="isRequired()">&nbsp;*</span>
    }
  </div>
  <div class="field-area">
    <ng-content></ng-content>
  </div>

  <mat-form-field-error-control
    [errorFormControl]="NgControl.control"
  ></mat-form-field-error-control>
</div>
